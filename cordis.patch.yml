# 蓝余汐 · 插件行
- insert:
    - id: lanyuxi
      name: dsh-lanyuxi
      config:
        napcatDir: E:\NapCat
        ownerQq: "1772538871"
        allowGroups:
          - "1126049389"
        sessionCwd: E:\dsh-foundry\lanyuxi-msg
        homeDir: E:\dsh-foundry\lanyuxi-home
        # 上下文用到多少百分比就开新的一段会话（面板上可改，10~90）
        # 推荐 50：实测长上下文里，超过 50% 开始丢早期细节，70% 后容易忘约束，
        # 90% 附近明显变笨（答非所问、重复、忽略人设）。宁可早切，靠会话检索跨段回忆。
        rolloverPercent: 50
        # 自动备份：默认每天一次；测试阶段可以关掉，只保留换段与手动备份
        backupEnabled: true
        backupHours: 24
        cooldownMs: 300000
        maxOutboundPerDay: 20
        groupOutboundPerDay: 10
        # 语音（M4）：装好 GPT-SoVITS 后把 voiceEnabled 改 true，API 默认 http://127.0.0.1:9880
        # 语音：auto 会按 GPT-SoVITS → edge-tts → SAPI 自动挑；voiceRealtime 控制慢引擎是否允许实时合成
        voiceEnabled: true
        voiceEngine: auto
        voiceRealtime: false
        pythonPath: python
        edgeTtsVoice: zh-CN-XiaoxiaoNeural
        sapiVoice: Microsoft Huihui Desktop
        # 参考音频与文本（宫园薰切片，日语提示 + 中文合成，跨语种）
        gptSovitsRef: E:\dsh-foundry\lanyuxi-home\voice\ref.wav
        gptSovitsPrompt: 君はひどい奴です。グズ、ノロマ、アンポントン。
        gptSovitsPromptLang: ja
        gptSovitsTextLang: zh
        gptSovitsApi: http://127.0.0.1:9880
        gptSovitsDir: E:\GPT-SoVITS
