# 蓝余汐 · 插件行
- insert:
    - id: lanyuxi
      name: dsh-lanyuxi
      config:
        napcatDir: E:\NapCat
        ownerQq: "1772538871"
        allowGroups:
          - "1126049389"
        sessionCwd: E:\dsh-foundry\lanyuxi-msg
        homeDir: E:\dsh-foundry\lanyuxi-home
        # 日记里的天气：填城市名（如 上海）就查 open-meteo 的真实天气；留空则由她自己写一个合理的
        weatherCity: ""
        # 上下文用到多少百分比就开新的一段会话（面板上可改，10~90）
        # 推荐 50：实测长上下文里，超过 50% 开始丢早期细节，70% 后容易忘约束，
        # 90% 附近明显变笨（答非所问、重复、忽略人设）。宁可早切，靠会话检索跨段回忆。
        rolloverPercent: 50
        cooldownMs: 300000
        maxOutboundPerDay: 20
        maxProactivePerDay: 3
        groupOutboundPerDay: 10
